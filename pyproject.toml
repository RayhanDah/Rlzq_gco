[project]
name = "rl-gco"
version = "0.0.1"
description = "Agent PPO Rocket League sous récompense Goal/Concede Only, déployé via RLBot v5"
requires-python = ">=3.11,<3.13"
# Dépendances runtime (rlgym, rocketsim, torch/jax, rlbot...) ajoutées en Phase 2 après vérification des versions (ADR-001).
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "kaggle==2.2.5",
    "six>=1.17.0",
]
learn = [
    "torch==2.15.0",
]
native = [
    "cmake>=3.25",
    "ninja>=1.13.2",
    "pybind11>=3.1.0",
]
rlbot = [
    "rlbot==2.0.0b56",  # RLBot v5 (PyPI, dépôt RLBot/python-interface) ; la « latest » stable 1.68.0 est v4
]
sim = [
    "numpy>=2,<3",
    "rocketsim==2.2.1",
]

[tool.uv]
default-groups = ["dev", "sim", "native", "learn", "rlbot"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["repos", "threads", "checkpoints", "runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères français (é, «, ’) dans chaînes et commentaires

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # layout src/ : les paquets s'importent comme `rewards`, `env`... (mypy fait de même)
addopts = "-ra"
