# Banc soutenu de la vraie boucle (tâche A5, sprint production/sprints/2026-11-13.md) : config la plus proche possible
# du futur run 4a GCO-std (docs/adr/005-run-4a.md D3, D4, D5, D6). Lancer avec scripts/bench_run.py, qui ajoute
# l'évaluation en cours de run (configs/bench_4a_eval.yaml) et arrête proprement le run après une durée murale.
# Le budget reste 1B appris : il fixe total_iterations, donc les calendriers de LR, d'entropie et de p_kick ; le banc
# n'en parcourt que le début.
# Écarts volontaires au futur run (sections opérationnelles, hors hash de trajectoire) : checkpoint.keep (aucune
# rotation pendant le banc : rien n'est supprimé dans checkpoints/) ; name.
name: bench_4a
seed: 0
device: xpu             # learner sur l'Arc (vendor/venv-xpu, ADR-001 M3–M4) ; sim RocketGPU en CPU

env:
  n_envs: 4096          # ADR-001 M4, ADR-005
  n_cars: 2             # 1v1
  tick_skip: 8

reward:
  variant: GCO-std      # docs/GCO_SPEC.md §3 ; aucune récompense ajoutée
  no_touch_timeout_s: 20.0
  max_episode_s: 120.0

initial_states:         # ADR-005 D4 : 0,2 -> 0,8 linéaire sur 0,5B appris, puis 0,8
  p_kick_start: 0.2
  p_kick_end: 0.8
  anneal_timesteps: 500000000

ppo:                    # identique à configs/smoke.yaml (docs/01_papers.md §2) ; total_iterations dérivé du budget
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  lr_start: 2.0e-4
  lr_end: 5.0e-5
  ent_coef_start: 0.01
  ent_coef_end: 0.002
  max_grad_norm: 0.5
  epochs: 2
  minibatch_size: 25000
  target_batch_size: 57344   # = 4096 x 2 x 7 (sans effet : collection.steps_per_batch fait foi)

collection:
  steps_per_batch: 7    # 57 344 collectés par lot, 51 611 appris avec le pool (RunConfig.batch_learned_steps ; l'ADR-005 D3 arrondit à 51 610)
  overlap: true

pool:                   # ADR-005 D5
  past_fraction: 0.2
  snapshot_every: 50
  max_size: 100
  quality_lr: 0.01

budget:
  total_timesteps: 1000000000   # 1B appris (ADR-005 D3) : 19 376 itérations (RunConfig.total_iterations)

checkpoint:
  # Proposition pour A6 : toutes les 250 itérations (≈ 12,9M appris ; ≈ 5 min à 1,2–1,3 s par itération, estimé
  # d'après M4, non mesuré pour la vraie boucle). Raisons : une restauration K4 rejoue au plus ≈ 5 min ; la confirmation
  # de S1 par un checkpoint sain (training.evalhook) tarde au plus 250 itérations, contre 969 entre deux évaluations ;
  # bien sous la règle des 20 min (.claude/rules/training.md) ; à ≈ 74 Mo par checkpoint avec 100 instantanés (estimé,
  # non mesuré), quelques secondes toutes les 5 min. Le banc mesure le coût unitaire (capture, écriture, taille) et
  # l'extrapole à 100 instantanés ; A6 fixe la valeur.
  every_iterations: 250
  keep: 1000            # banc : aucune rotation (le futur run garde keep: 2, ADR-005 D2)
  include_sim_state: true

kill:                   # ADR-005 D6 : K2 (entropie, alerte à 50 %), K3 (EV après S1), K4 (KL, NaN), K5 (restaurations)
  kl_threshold: 0.05
  kl_patience: 5
  entropy_floor_frac: 0.10
  entropy_alert_frac: 0.50
  n_actions: 90
  entropy_patience: 1
  ev_floor: 0.0
  ev_patience: 50
  max_restores: 3
  max_consecutive_restores: 2

logging:
  every_iterations: 1
  fsync: false
