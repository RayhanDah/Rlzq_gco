# Run long de démo (docs/adr/014-run-long-demo.md, G3). Copie de run_4a_s.yaml (GCO-S, le meilleur mesuré à 1B :
# docs/reports/gcos_s0.md) ; seules différences : `name` et `budget.total_timesteps` (25B appris, ≈ 5,7 j estimé à
# ≈ 51k/s, non mesuré à cette durée). GCO strict : aucune récompense ajoutée, aucun signal d'exploration.
# Lancer avec scripts/run_4a.py --variant long (éval configs/long_eval.yaml, reprise auto après perte du GPU).
name: long_run
seed: 0
device: xpu             # learner sur l'Arc (vendor/venv-xpu, ADR-001 M3–M4) ; sim RocketGPU en CPU

env:
  n_envs: 4096          # ADR-001 M4, ADR-005
  n_cars: 2             # 1v1
  tick_skip: 8

reward:
  variant: GCO-S        # docs/GCO_SPEC.md §3 ; aucune récompense ajoutée, aucun état générique
  no_touch_timeout_s: 20.0
  max_episode_s: 120.0

initial_states:         # GCO-S : kickoffs seuls, p_kick = 1,0 imposé (spec §3, training.config)
  p_kick_start: 1.0
  p_kick_end: 1.0
  anneal_timesteps: 500000000

ppo:                    # identique à configs/smoke.yaml (docs/01_papers.md §2) ; total_iterations dérivé du budget
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  lr_start: 2.0e-4
  lr_end: 5.0e-5
  ent_coef_start: 0.01
  ent_coef_end: 0.002
  max_grad_norm: 0.5
  epochs: 2
  minibatch_size: 25000
  target_batch_size: 57344   # = 4096 x 2 x 7 (sans effet : collection.steps_per_batch fait foi)

collection:
  steps_per_batch: 7    # 57 344 collectés par lot, 51 611 appris avec le pool (RunConfig.batch_learned_steps ; l'ADR-005 D3 arrondit à 51 610)
  overlap: true

pool:                   # ADR-005 D5
  past_fraction: 0.2
  snapshot_every: 50
  max_size: 100
  quality_lr: 0.01

budget:
  total_timesteps: 25000000000  # 25B appris (ADR-014) : calendriers LR et entropie étalés sur tout le run

checkpoint:
  # Toutes les 250 itérations (≈ 12,9M appris, ≈ 4 min au plateau de M8) : coût mesuré 1,0 % du temps (ADR-001 M8),
  # rejeu d'au plus ≈ 4 min après une restauration K4, bien sous la règle des 20 min (.claude/rules/training.md).
  every_iterations: 250
  keep: 2               # ADR-005 D2 : rotation des checkpoints de reprise ; les instantanés d'évaluation sont à part
  include_sim_state: true

kill:                   # ADR-005 D6 : K2 (entropie, alerte à 50 %), K3 (EV après S1), K4 (KL, NaN), K5 (restaurations)
  kl_threshold: 0.05
  kl_patience: 5
  entropy_floor_frac: 0.10
  entropy_alert_frac: 0.50
  n_actions: 90
  entropy_patience: 1
  ev_floor: 0.0
  ev_patience: 50
  max_restores: 3
  max_consecutive_restores: 2

logging:
  every_iterations: 1
  fsync: false
