# Banc D7 de l'ADR-009 (self-imitation, accepté le 2026-11-21) : config la plus proche possible du run int_sil_s0.
# Copie de configs/int_sil.yaml ; SEULS écarts, vérifiés par tests/unit/test_sil_bench_tools.py : `name` et
# `checkpoint.keep` (section opérationnelle, hors hash de trajectoire : aucune rotation pendant le banc, rien n'est
# supprimé dans checkpoints/ ; le run garde keep: 2, ADR-005 D2). Même logique que bench_4a.yaml vs run_4a_std.yaml.
# Lancer (séquence complète : rapport de préparation du banc D7) :
#   vendor/venv-xpu/Scripts/python scripts/bench_run.py --config configs/bench_int_sil.yaml
#     --eval-config configs/run_s1v2_eval.yaml --name-prefix bench_int_sil --minutes 30 --prefill-pool 100 --sample-s 1
#   python scripts/sil_bench_summary.py runs/bench_int_sil_<horodatage>     # disp_share, débit, RAM, décision D5
# Disque : un checkpoint toutes les 250 itérations, plus l'itération 0 et le final, sans rotation ; chacun porte
# l'état SIL (anneau 0,49 Go + buffer 0,06 Go, tests/unit/test_sil.py) et le pool (0,23 Go à 100 instantanés,
# ADR-001 M6) : ≈ 0,8 Go par checkpoint (estimé, non mesuré).
name: bench_int_sil
seed: 0
device: xpu             # learner sur l'Arc (vendor/venv-xpu, ADR-001 M3–M4) ; sim RocketGPU en CPU

env:
  n_envs: 4096          # ADR-001 M4, ADR-005
  n_cars: 2             # 1v1
  tick_skip: 8

reward:
  variant: GCO-std      # docs/GCO_SPEC.md §3 ; aucune récompense ajoutée
  no_touch_timeout_s: 20.0
  max_episode_s: 120.0

initial_states:         # ADR-005 D4 : 0,2 -> 0,8 linéaire sur 0,5B appris, puis 0,8
  p_kick_start: 0.2
  p_kick_end: 0.8
  anneal_timesteps: 500000000

ppo:                    # identique à configs/smoke.yaml (docs/01_papers.md §2) ; total_iterations dérivé du budget
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  lr_start: 2.0e-4
  lr_end: 5.0e-5
  ent_coef_start: 0.01
  ent_coef_end: 0.002
  max_grad_norm: 0.5
  epochs: 2
  minibatch_size: 25000
  target_batch_size: 57344   # = 4096 x 2 x 7 (sans effet : collection.steps_per_batch fait foi)

collection:
  steps_per_batch: 7    # 57 344 collectés par lot, 51 611 appris avec le pool (RunConfig.batch_learned_steps ; l'ADR-005 D3 arrondit à 51 610)
  overlap: true

pool:                   # ADR-005 D5
  past_fraction: 0.2
  snapshot_every: 50
  max_size: 100
  quality_lr: 0.01

budget:
  total_timesteps: 1000000000   # 1B appris (ADR-005 D3) : 19 376 itérations ; fixe les calendriers, le banc n'en parcourt que le début

checkpoint:
  # Toutes les 250 itérations, comme le run (≈ 12,9M appris, ≈ 4 min au plateau de M8) : le banc mesure le pic de RAM
  # à l'écriture d'un checkpoint qui porte l'état SIL (ADR-009 D7).
  every_iterations: 250
  keep: 1000            # banc : aucune rotation (le run garde keep: 2, ADR-005 D2)
  include_sim_state: true

kill:                   # ADR-005 D6 : K2 (entropie, alerte à 50 %), K3 (EV après S1), K4 (KL, NaN), K5 (restaurations)
  kl_threshold: 0.05
  kl_patience: 5
  entropy_floor_frac: 0.10
  entropy_alert_frac: 0.50
  n_actions: 90
  entropy_patience: 1
  ev_floor: 0.0
  ev_patience: 50
  max_restores: 3
  max_consecutive_restores: 2

logging:
  every_iterations: 1
  fsync: false

sil:                    # ADR-009 (Oh et al. 2018, annexe A, tableaux 3–4) ; src/training/sil.py ; identique à int_sil.yaml
  enabled: true         # C3 : false = PPO seul, bit à bit
  coef: 0.1             # D2 : c_sil au plateau (tableau 4) ; provisoire : c'est ce banc qui le calibre (D5)
  anneal_start_timesteps: 500000000   # D4 (C2) : 0,1 jusqu'à 0,5B appris ...
  anneal_end_timesteps: 900000000     # ... linéaire jusqu'à 0 à 0,9B, puis 0 (buffer libéré)
  value_coef: 0.01      # D2 : β (tableau 3)
  mode: joint           # D3 : lot SIL ajouté à chacun des minibatchs PPO, même Adam, clip global de PPO
  batch_size: 4096      # D3 : lot SIL par minibatch PPO
  capacity: 250000      # D3 : transitions, FIFO
  horizon_steps: 300    # D1 : 20 s avant le but
  priority_alpha: 0.6   # D2
  priority_eps: 1.0e-3  # D2
  is_beta: 0.1          # D2
  keep_conceded: false  # D1 : buts gagnés (+1) seulement
  store_float16: true   # D1 : parité float16 testée (D7-5)
  share_alert: 0.5      # D5 : alerte C4 si disp_share > 0,5 pendant 50 itérations
  share_alert_patience: 50
  share_stop: 0.8       # KS2 : STOP si disp_share > 0,8 pendant 500 itérations avec c_sil > 0
  share_stop_patience: 500
  ram_min_available_mb: 1000.0   # KS1 : STOP si RAM disponible < 1 Go pendant > 10 min
  ram_low_max_s: 600.0
