# Smoke test du chemin de la tâche auxiliaire (ADR-010 D8 : « smoke test vert sur le commit du run ») : copie de
# configs/smoke.yaml plus le bloc `aux` de configs/int_aux.yaml, À L'IDENTIQUE. SEULS écarts à smoke.yaml : `name`, le
# bloc `aux` et `budget.total_timesteps` (tests/unit/test_auxtask.py) :
# - 48 itérations (2 752 512 timesteps) au lieu de 18 : un pas ne sort avec y = 0 qu'après H pas sans fin d'épisode ;
#   à H = 150, 18 itérations = 126 pas par agent, compartiment y = 0 vide, aucun lot (smoke 690a828). Depuis le repli
#   H = 100 de D2 (banc du 2026-11-22), reprise à 24 : 168 pas par agent, lots possibles dès l'itération 15 (test), donc
#   avant ET après la reprise ; budget de 48 conservé (1er lot possible 9 itérations avant la reprise) ;
# - pourquoi pas un H court : la fenêtre (178,7 Mo à H = 100, calcul ; 268 Mo mesuré à H = 150 en 690a828) et les lots
#   ne seraient plus à la taille du run.
#   batch_size revient à 8 192 : y ≠ 0 n'était pas limitant (22 122 transitions à l'itération 18, mesuré en 690a828).
#   Durée : ≈ 2,3 min (estimé, non mesuré, d'après 690a828 : 1,2 s par itération et ≈ 4 s par checkpoint).
# Lancer : vendor/venv-xpu/Scripts/python scripts/train.py configs/smoke_aux.yaml --smoke
#            --out-dir runs/smoke_aux_<commit> --checkpoint-dir checkpoints/smoke_aux_<commit>
#          python scripts/aux_bench_summary.py --smoke runs/smoke_aux_<commit>   # lots, perte, rejeu à la reprise
name: smoke_aux
seed: 0
device: auto            # cuda, sinon xpu, sinon cpu (training.ppo.resolve_device)

env:
  n_envs: 4096          # ADR-001 M4
  n_cars: 2             # 1v1 : 2 agents par arène
  tick_skip: 8

reward:
  variant: GCO-std      # GCO-S | GCO-std | GCO-ext | scorer-only (docs/GCO_SPEC.md §3) ; aucune récompense ajoutée
  no_touch_timeout_s: 20.0   # spec §2.2
  max_episode_s: 120.0

initial_states:         # spec §2.3 : p_kick 0,2 au départ, annealing linéaire vers >= 0,8 (GCO-std seulement)
  p_kick_start: 0.2
  p_kick_end: 0.8
  anneal_timesteps: 1000000

ppo:                    # sources : docs/01_papers.md §2 (total_iterations est dérivé du budget)
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  lr_start: 2.0e-4
  lr_end: 5.0e-5
  ent_coef_start: 0.01
  ent_coef_end: 0.002
  max_grad_norm: 0.5
  epochs: 2
  minibatch_size: 25000
  target_batch_size: 57344   # = 4096 arènes x 2 agents x 7 steps (sans effet : `collection.steps_per_batch` fait foi)

collection:
  steps_per_batch: 7    # ADR-001 M4 : 57 344 timesteps agents par lot
  overlap: true         # apprentissage du lot k pendant la collecte du lot k+1 (staleness 1)

budget:
  total_timesteps: 2752512   # 48 lots exactement (smoke.yaml : 1 000 000, 18 itérations ; voir l'en-tête)

checkpoint:
  every_iterations: 3   # assez fréquent pour exercer sauvegarde et rotation (keep 2) pendant le smoke test
  keep: 2
  include_sim_state: true    # reprise exacte (état du simulateur inclus)

kill:                   # gardes (docs/PLAN.md, kill criteria préliminaires) ; décisions appliquées à chaque itération
  kl_threshold: 0.05
  kl_patience: 5        # KL approx > 0,05 pendant 5 itérations -> restauration du dernier checkpoint sain
  entropy_floor_frac: 0.10   # entropie < 10 % de ln(90) avant S1 -> arrêt
  n_actions: 90
  entropy_patience: 1
  ev_floor: 0.0         # explained variance < 0 pendant 50 itérations après S1 -> arrêt (S1 : crochet `s1_provider` de `run`, jamais atteint par défaut)
  ev_patience: 50
  max_restores: 3       # restaurations CUMULÉES sur tout le run (une itération saine ne remet pas à zéro) -> arrêt
  max_consecutive_restores: 2   # restaurations sans itération saine entre deux -> arrêt (même divergence rejouée)

logging:
  every_iterations: 1
  fsync: false

smoke:                  # exigences de `scripts/train.py --smoke`
  resume_at_fraction: 0.5    # arrêt puis reprise depuis le checkpoint final à ~50 % du budget
  require_resume: true
  max_nan: 0

aux:                    # bloc de configs/int_aux.yaml (ADR-010 D1–D6), sans écart
  enabled: true
  coef: 0.1
  horizon_steps: 100
  batch_size: 8192
  capacity_per_class: 125000
  store_float16: true
  share_alert: 0.5
  share_alert_patience: 50
  ram_min_available_mb: 1000.0
  ram_low_max_s: 600.0
